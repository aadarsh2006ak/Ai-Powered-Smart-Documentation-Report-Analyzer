services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: smartdoc_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: doc_analyzer
    volumes:
      - mongo_data:/data/db
    networks:
      - smartdoc_net

  # 2. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: smartdoc_redis
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    networks:
      - smartdoc_net

  # 3. Express API Gateway & BullMQ Worker
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smartdoc_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/doc_analyzer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: production_super_secret_jwt_key_smartdoc_2026
      JWT_REFRESH_SECRET: production_super_secret_refresh_jwt_key_smartdoc_2026
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongodb
      - redis
    networks:
      - smartdoc_net

  # 4. React Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smartdoc_client
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - api
    networks:
      - smartdoc_net

volumes:
  mongo_data:
  redis_data:

networks:
  smartdoc_net:
    driver: bridge
